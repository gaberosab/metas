<style>
/* Layout: pastel fofo — resumo num cartão degradê rosa→lilás, abas em pílulas, metas em cartões brancos bem redondos */
:root{
  color-scheme:light;
  --bg:#fbf3f7; --surface:#ffffff; --surface-2:#fdf0f6; --line:#f1dde8; --line-2:#e7c9da;
  --text:#4a3550; --muted:#9c7d98; --faint:#c4aac0;
  --accent:#d36d9c; --accent-2:#a98be8; --money:#c2558a; --money-soft:#fbe4ef;
  --ok:#3f9a6c; --ok-soft:#e4f6ec; --mid:#d36d9c; --mid-soft:#fbe4ef;
  --long:#8a6bd6; --long-soft:#efe8fd; --warn:#b7791f; --warn-soft:#fdf1dc; --bad:#d94b5f;
  --shadow:0 4px 16px rgba(160,100,150,.10);
  --f-display:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;font-weight:600}
.wrap{max-width:880px;margin:0 auto;padding-block:22px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:800}
h1{font-size:1.5rem;font-weight:900}
h2{font-size:1.08rem}
h3{font-size:1.02rem}
.num{font-variant-numeric:tabular-nums}
.money{color:var(--money);font-weight:800;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.lbl{font-size:.74rem;color:var(--muted);font-weight:800;letter-spacing:.02em}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hello{display:grid;gap:2px}

.hero{border-radius:26px;padding:20px;display:grid;gap:16px;background:linear-gradient(135deg,#f9d3e3 0%,#ecd9f7 55%,#e1d6fb 100%);box-shadow:var(--shadow)}
.herorow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.big{font-family:var(--f-display);font-size:2.3rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat{display:grid;gap:3px;min-width:0}
.stat b{font-weight:800;font-variant-numeric:tabular-nums}
.hero .lbl{color:#8d6488}
.pool{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.6);border-radius:18px;padding:10px 12px;flex-wrap:wrap}
.pool b{font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.hero .bar{background:rgba(255,255,255,.55)}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.full>i{background:var(--ok)}
.bar.thin{height:9px}
.spark{width:100%;height:54px;display:block}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.invgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 22px}
.steprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface-2);border-radius:16px;padding:8px 10px;font-size:.9rem}
.steprow input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;width:56px;text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.tabs button{font-size:.8rem;padding:9px 4px}.tabs .cnt{display:none}}
.tabs button{border:0;background:var(--surface);border-radius:99px;padding:10px 6px;font-weight:800;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center;box-shadow:var(--shadow)}
.tabs button[aria-selected="true"]{background:var(--text);color:#fff}
.tabs .cnt{font-size:.72rem;background:rgba(160,100,150,.12);border-radius:99px;padding:1px 7px}
.tabs button[aria-selected="true"] .cnt{background:rgba(255,255,255,.2);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:0;background:var(--surface);border-radius:99px;padding:6px 13px;font-weight:800;font-size:.84rem;color:var(--muted);box-shadow:0 2px 8px rgba(160,100,150,.08)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.search{flex:1 1 170px;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px}
.toggle{display:flex;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.toggle input{accent-color:var(--accent)}

.btn{border:1.5px solid var(--line-2);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:800;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:#f6d0d6}
.btn.sm{padding:6px 12px;font-size:.84rem}

.goals{display:flex;flex-direction:column;gap:12px}
.goal{background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.ghead{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 14px 14px 16px;align-items:center}
.prio{width:32px;height:32px;border-radius:50%;background:var(--mid-soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-variant-numeric:tabular-nums;font-size:.9rem}
.goal.personal .prio{background:var(--long-soft);color:var(--long)}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex-direction:column;gap:1px;height:40px!important;border-radius:14px!important;align-content:center}
.grip span{line-height:1}
.grip svg{width:12px;height:6px;fill:currentColor;opacity:.55}
.goal.dragging{position:relative;z-index:30;box-shadow:0 18px 40px rgba(160,100,150,.35);transition:none;cursor:grabbing}
.goal.dragging .grip{cursor:grabbing;background:var(--accent);color:#fff}
.goals.sorting .goal:not(.dragging){transition:transform .15s}
.igrip{width:18px;height:30px;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px;margin-left:-4px}
.igrip svg{width:6px;height:12px;fill:currentColor}
.igrip:hover,.igrip:focus-visible{color:var(--accent);background:var(--surface-2)}
.item.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.item.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.item.drop-into{background:var(--mid-soft);border-radius:14px;box-shadow:0 0 0 2px var(--accent);position:relative}
.item.drop-into::after{content:"Soltar para virar subtarefa";position:absolute;right:8px;bottom:-11px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;z-index:5}
.item.dragging{opacity:.92;position:relative;z-index:30;background:var(--surface);box-shadow:0 10px 26px rgba(160,100,150,.3);border-radius:14px;border-bottom-color:transparent}
.item.dragging .igrip{color:var(--accent);cursor:grabbing}
.subr{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.secmv{display:inline-flex;gap:3px}
.secmv button{border:0;background:var(--surface-2);color:var(--muted);border-radius:8px;width:24px;height:22px;font-size:.62rem;line-height:1}
.secmv button:disabled{opacity:.35}
.iname-a{color:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.iname-a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.ilinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ilinks:empty{display:none}
.ilinks .buy,.ilinks .addlink{margin-top:4px}
.item>.igrip{margin-top:-3px}
.item>input[type=checkbox]{appearance:none;-webkit-appearance:none;width:21px;height:21px;margin:1px 0 0;border-radius:7px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.item>input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.item>input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.item>input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item>.money{padding-top:2px}
.item>.iact{margin-top:-5px}
.isubs{list-style:none;margin:8px 0 2px;padding:2px 0 2px 12px;display:grid;gap:4px;border-left:2px solid var(--line)}
.isubs li{display:flex;align-items:center;gap:6px;font-size:.88rem}
.isubs label{display:flex;align-items:center;gap:7px;flex:1;min-width:0;cursor:pointer}
.isubs input[type=checkbox]{appearance:none;-webkit-appearance:none;width:17px;height:17px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);flex:none;margin:0;display:grid;place-items:center;cursor:pointer}
.isubs input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.isubs input[type=checkbox]:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.isubs span{color:var(--text);font-weight:600}
.subnew{border:0;background:none;color:var(--muted);font-size:.82rem;font-weight:800;padding:2px 0}
.subnew:hover{color:var(--accent)}
.icon.plus{color:var(--accent)}
.icon.trash:hover{color:var(--bad);background:var(--red-soft,var(--surface-2))}
.iact{gap:0}
.iact .icon{width:28px}
.isubs li.ok .subtxt{text-decoration:line-through;color:var(--faint)}
.subtxt{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:600;color:var(--text);padding:2px 4px;border-radius:6px}
.subtxt:hover{background:var(--surface-2)}
.subtxt:focus{outline:none;background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--accent)}
.isubs .sx{border:0;background:none;color:var(--faint);font-size:.75rem;padding:2px 6px;border-radius:6px;opacity:.6}
.isubs .sx:hover{color:var(--bad);background:var(--surface-2)}
.subadd{border:0;border-bottom:1.5px dashed var(--line-2);background:transparent;padding:4px 2px;font-size:.86rem;width:100%;min-width:0}
.subadd:focus{outline:none;border-bottom-color:var(--accent)}
.subp{background:var(--surface-2);color:var(--muted);border:0;cursor:pointer;font-family:inherit}
.subp:hover{background:var(--mid-soft);color:var(--accent)}
.more-list{display:grid;gap:8px}
.more-op{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:var(--surface-2);border-radius:16px;padding:12px 14px}
.more-op:hover{background:var(--mid-soft)}
.more-op b{display:block;font-weight:800}
.more-op small{display:block;color:var(--muted);font-size:.8rem}
.more-ic{width:34px;height:34px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:1rem;color:var(--accent);flex:none}
.thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.thumb{border:0;padding:0;width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 1.5px var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox img{width:100%;max-height:60vh;object-fit:contain;border-radius:16px;background:var(--surface-2)}
.recq{color:var(--ok)!important;font-weight:700}
.item.done .recq{color:var(--ok)!important}
.donetoggle{border:0;background:none;color:var(--accent);font-weight:800;font-size:.85rem;padding:6px 0;text-align:left}
.buy{display:inline-flex;align-items:center;gap:4px;margin-top:4px;background:var(--mid-soft);color:var(--accent);border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:800;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buy:hover{background:var(--accent);color:#fff}
.buy.alt{background:var(--long-soft);color:var(--long)}
.buy.alt:hover{background:var(--long);color:#fff}
.nlink{color:var(--accent);font-weight:800}
.addlink{margin-top:4px;border:1.5px dashed var(--line-2);background:none;color:var(--muted);border-radius:99px;padding:2px 10px;font-size:.76rem;font-weight:800}
.addlink:hover{border-color:var(--accent);color:var(--accent)}
.gmain{min-width:0;display:grid;gap:8px;cursor:pointer;text-align:left;background:none;border:0;padding:0}
.gtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);align-items:baseline}
.gmeta b{color:var(--text);font-variant-numeric:tabular-nums}
.order{display:flex;flex-direction:column;gap:3px}
.order button{border:0;background:var(--surface-2);border-radius:10px;width:30px;height:24px;line-height:1;color:var(--muted);font-size:.7rem}
.order button:disabled{opacity:.35;cursor:default}
.pill{font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap}
.h-curto{background:var(--ok-soft);color:var(--ok)}
.h-medio{background:var(--mid-soft);color:var(--mid)}
.h-longo{background:var(--long-soft);color:var(--long)}
.rev{background:var(--warn-soft);color:var(--warn)}
.gbody{border-top:1.5px dashed var(--line);padding:4px 16px 16px;display:grid;gap:6px}
.gnote{color:var(--muted);font-size:.88rem;background:var(--surface-2);border-radius:14px;padding:10px 12px;margin-top:10px}
.sub{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 0 4px;flex-wrap:wrap}
.sub h4{margin:0;font-size:.78rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub span{font-size:.8rem;color:var(--muted)}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}
.iname{min-width:0;overflow-wrap:anywhere}
.iname small{display:block;color:var(--faint);font-size:.8rem}
.item.done .iname>span{text-decoration:line-through;color:var(--faint)}
.item .money.none{color:var(--faint);font-weight:600;font-size:.82rem}
.iact{display:flex;gap:2px}
.icon{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;text-decoration:none}
.icon:hover{background:var(--surface-2);color:var(--accent)}
.icon svg{width:16px;height:16px}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addrow input,.addrow select{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;min-width:0}
.addrow input.n{flex:1 1 160px}.addrow input.p{flex:0 1 110px}.addrow select{flex:0 1 170px}
.gfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.section{background:var(--surface);border-radius:24px;padding:16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tscroll{overflow-x:auto}
.table{width:100%;border-collapse:collapse}
.table td{padding:9px 4px;border-bottom:1.5px dashed var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table td.r{text-align:right;white-space:nowrap}
@media (max-width:440px){#inv-table .table{font-size:.78rem!important}#inv-table .table td{padding:8px 2px}}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-bottom:1.5px dashed var(--line);align-items:center;font-size:.9rem}
.log li:last-child{border-bottom:0}
.log .d{color:var(--faint);font-size:.8rem;font-variant-numeric:tabular-nums}
.pos{color:var(--ok);font-weight:800}.neg{color:var(--bad);font-weight:800}
.empty{padding:30px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:10px 12px;font-size:.88rem}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--accent);color:#fff;border:0;border-radius:99px;padding:14px 22px;font-weight:900;box-shadow:0 10px 26px rgba(211,109,156,.35);font-size:.98rem}
.overlay{position:fixed;inset:0;background:rgba(74,53,80,.35);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--surface);border-radius:26px;width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:20px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(74,53,80,.25)}
.field{display:grid;gap:5px}
.field label{font-size:.8rem;font-weight:800;color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 12px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px;font-weight:800;border-radius:99px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--text);color:#fff;
  border-radius:99px;padding:10px 18px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);font-size:.9rem;font-weight:700}
.toast button{background:none;border:0;color:#f9c5dc;font-weight:900;text-decoration:underline}
@media (max-width:520px){
  .big{font-size:2rem}
  .ghead{gap:10px;padding:12px}
  .prio{width:28px;height:28px;font-size:.8rem}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

          cb({ exists: !!data, data: () => data ? data.data : undefined });
        };
        puxar();
        sb.channel("docs-" + name).on("postgres_changes", { event: "*", schema: "public", table: "docs", filter: "user_id=eq." + user.id }, p => { if (p.new && p.new.id === name) puxar(); }).subscribe();
        document.addEventListener("visibilitychange", () => { if (!document.hidden) puxar(); });
        return () => {};
      }
    };
  }
  const dbShim = { doc: path => docRef(path.split("/").pop()) };
  const assetsShim = {
    async upload(blob, opt){ const path = user.id + "/" + Date.now().toString(36) + Math.random().toString(36).slice(2,8) + ".jpg"; const { error } = await sb.storage.from("fotos").upload(path, blob, { contentType: (opt && opt.type) || blob.type || "image/jpeg" }); if (error) throw { code: "erro", message: error.message }; return { id: path, url: window.IMG_URL(path) }; },
    async delete(id){ await sb.storage.from("fotos").remove([id]); }
  };
  let pronto, prontoP = new Promise(r => pronto = r);
  window.claude = { use: async n => { await prontoP; return n === "db" ? dbShim : n === "assets" ? assetsShim : null; } };

  function tela(html){ let el = document.getElementById("authgate"); if (!el){ el = document.createElement("div"); el.id = "authgate"; document.body.appendChild(el); } el.innerHTML = html; el.hidden = false; return el; }
  function esconder(){ const el = document.getElementById("authgate"); if (el) el.hidden = true; }
  async function entrar(){
    if (!sb){ tela('<div class="ag-card"><h2>Falta configurar</h2><p>Abra o arquivo index.html e cole a Project URL e a anon key do Supabase no começo do segundo &lt;script&gt; (veja o LEIA-ME).</p></div>'); return; }
    const { data } = await sb.auth.getSession();
    if (data.session){ user = data.session.user; await depoisDoLogin(); return; }
    const el = tela(`<div class="ag-card"><h2>Metas &amp; compras</h2><p>Entre com o seu e-mail e senha.</p>
      <form id="agf"><input id="ag-e" type="email" placeholder="E-mail" autocomplete="email" required><input id="ag-p" type="password" placeholder="Senha (mín. 6)" autocomplete="current-password" required minlength="6">
      <button class="ag-btn" id="ag-in">Entrar</button><button type="button" class="ag-link" id="ag-up">Primeira vez? Criar conta</button><p id="ag-msg" class="ag-msg"></p></form></div>`);
    const msg = t => el.querySelector("#ag-msg").textContent = t;
    el.querySelector("#agf").onsubmit = async e => { e.preventDefault(); msg("Entrando…");
      const { data, error } = await sb.auth.signInWithPassword({ email: el.querySelector("#ag-e").value.trim(), password: el.querySelector("#ag-p").value });
      if (error){ msg(error.message.includes("Invalid") ? "E-mail ou senha errados." : error.message.includes("confirm") ? "Confirme o e-mail pelo link que chegou na sua caixa de entrada." : error.message); return; }
      user = data.user; await depoisDoLogin(); };
    el.querySelector("#ag-up").onclick = async () => { msg("Criando…");
      const { data, error } = await sb.auth.signUp({ email: el.querySelector("#ag-e").value.trim(), password: el.querySelector("#ag-p").value });
      if (error){ msg(/database error|saving new user/i.test(error.message) ? "Esse e-mail ainda não está liberado. Peça para o Gabe liberar e tente de novo." : error.message); return; }
      if (data.session){ user = data.user; await depoisDoLogin(); } else msg("Conta criada. Confirme pelo link que chegou no seu e-mail e depois toque em Entrar."); };
  }
  async function depoisDoLogin(){
    const { data } = await sb.from("docs").select("id").eq("user_id", user.id);
    if (!data || !data.length){
      const el = tela(`<div class="ag-card"><h2>Trazer seus dados</h2><p>Escolha o arquivo <b>dados-metas.json</b> que veio junto (ou um que você exportou). Se quiser começar do zero, pule.</p>
        <input type="file" id="ag-f" accept="application/json,.json"><button type="button" class="ag-link" id="ag-skip">Começar do zero</button><p id="ag-msg" class="ag-msg"></p></div>`);
      await new Promise(res => {
        el.querySelector("#ag-skip").onclick = res;
        el.querySelector("#ag-f").onchange = async e => { try { const j = JSON.parse(await e.target.files[0].text());
          const rows = []; if (j.state) rows.push({ user_id: user.id, id: "state", data: j.state }); if (j.gastos) rows.push({ user_id: user.id, id: "gastos", data: j.gastos });
          if (!rows.length) throw new Error("arquivo sem dados"); const { error } = await sb.from("docs").upsert(rows); if (error) throw error; res(); }
          catch(err){ el.querySelector("#ag-msg").textContent = "Não consegui ler esse arquivo: " + (err.message || err); } };
      });
    }
    esconder(); if (window.Cores) await Cores.iniciar(sb, user); pronto(); rodape();
  }
  function rodape(){
    const f = document.createElement("div"); f.className = "ag-foot";
    f.innerHTML = `<span>${user.email}</span><button id="ag-cores">Cores</button><button id="ag-exp">Exportar dados</button><button id="ag-imp">Importar dados</button><input type="file" id="ag-impf" accept="application/json,.json" hidden><button id="ag-out">Sair</button>`;
    const fi = f.querySelector("#ag-impf"); f.querySelector("#ag-imp").onclick = () => fi.click();
    fi.onchange = async () => { let j; try { j = JSON.parse(await fi.files[0].text()); } catch(e){ alertaImp("Não consegui ler esse arquivo."); return; } fi.value = "";
      if (!j || (!j.state && !j.gastos)){ alertaImp("Esse arquivo não tem dados do app."); return; }
      const el = tela(`<div class="ag-card"><h2>Trocar os dados?</h2><p>Os dados de agora serão substituídos pelos do arquivo${j.state ? " (" + (j.state.goals||[]).length + " metas)" : ""}. Se quiser guardar os atuais, cancele e use "Exportar dados" antes.</p>
        <button type="button" class="ag-btn" id="ag-ok">Trocar os dados</button><button type="button" class="ag-link" id="ag-no">Cancelar</button><p id="ag-msg" class="ag-msg"></p></div>`);
      el.querySelector("#ag-no").onclick = () => { el.hidden = true; };
      el.querySelector("#ag-ok").onclick = async () => { el.querySelector("#ag-msg").textContent = "Salvando…";
        const rows = []; if (j.state) rows.push({ user_id: user.id, id: "state", data: j.state, updated_at: new Date().toISOString() }); if (j.gastos) rows.push({ user_id: user.id, id: "gastos", data: j.gastos, updated_at: new Date().toISOString() });
        const { error } = await sb.from("docs").upsert(rows); if (error){ el.querySelector("#ag-msg").textContent = "Não consegui salvar: " + error.message; return; }
        location.reload(); }; };
    function alertaImp(t){ const el = tela(`<div class="ag-card"><h2>Importar dados</h2><p>${t}</p><button type="button" class="ag-btn" id="ag-no">Fechar</button></div>`); el.querySelector("#ag-no").onclick = () => { el.hidden = true; }; }
    document.querySelector(".wrap").appendChild(f); f.querySelector("#ag-cores").onclick = () => window.Cores && Cores.abrir();
    f.querySelector("#ag-out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
    f.querySelector("#ag-exp").onclick = async () => { const { data } = await sb.from("docs").select("id,data").eq("user_id", user.id); const o = {}; (data||[]).forEach(r => o[r.id] = r.data);
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: "application/json" })); a.download = "metas-" + new Date().toISOString().slice(0,10) + ".json"; a.click(); };
  }
  document.addEventListener("DOMContentLoaded", entrar);
})();
</script>

<script>
(function(){

 link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',

const undo=[];

const r2=n=>Math.round(n*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9);
function parseBRL(v){ if(v==null) return 0; let s=String(v).replace(/[R$\s]/g,''); if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isFinite(n)?r2(n):0; }
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{const [y,m,dd]=String(d).split('-');return dd&&m?`${dd}/${m}`:d};

function blank(){return {version:2,pool:0,goals:[],fixed:[],log:[]}}
function norm(s){ s=s&&typeof s==='object'?JSON.parse(JSON.stringify(s)):blank();
  s.pool=+s.pool||0; s.goals=Array.isArray(s.goals)?s.goals:[]; s.fixed=Array.isArray(s.fixed)?s.fixed:[]; s.log=Array.isArray(s.log)?s.log:[];
  s.goals.forEach(g=>{g.id=g.id||uid(); g.items=Array.isArray(g.items)?g.items:[]; g.saved=+g.saved||0; g.target=+g.target||0; g.h=g.h||'medio'; g.kind=['pessoal','recorrente'].includes(g.kind)?g.kind:'compra';
    g.items.forEach(i=>{i.id=i.id||uid(); i.price=+i.price||0;}); });
  s.fixed.forEach(f=>{f.id=f.id||uid(); f.value=+f.value||0}); return s; }

const target=g=> g.target>0? g.target : g.items.filter(i=>!i.done).reduce((a,i)=>a+(i.price||0),0);
const totalSaved=()=> state.pool + state.goals.reduce((a,g)=>a+g.saved,0);
const pct=(a,b)=> b>0? Math.min(100,a/b*100) : 0;
const subsOf=g=>[...new Set([...(Array.isArray(g.secs)?g.secs:[]),...g.items.map(i=>i.sub)].filter(Boolean))];
const ofKind=k=>state.goals.filter(g=>g.kind===k);

/* ---------- persistência ---------- */
let saveTimer=null, lastJSON='';
function persist(){
  try{localStorage.setItem('metas-cache',JSON.stringify(state))}catch(e){}
  if(!ref) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{ saveTimer=null; lastJSON=JSON.stringify(state);
    try{ await ref.set(JSON.parse(lastJSON)); showBanner(''); }catch(e){ showBanner('Não consegui salvar agora ('+(e&&e.code||'erro')+'). Suas mudanças ficam neste aparelho até a próxima tentativa.'); }
  },500);

  try{localStorage.setItem('metas-gastos-cache',JSON.stringify(GS))}catch(e){}
  if(!ref2) return;
  clearTimeout(saveTimer2);
  saveTimer2=setTimeout(async()=>{ saveTimer2=null; lastJSON2=JSON.stringify(GS);
    try{ await ref2.set(JSON.parse(lastJSON2)); }catch(e){ showBanner('Não consegui salvar os gastos agora ('+(e&&e.code||'erro')+').'); }
  },500);
}
function mutate(fn,msg){ undo.push(JSON.stringify({s:state,g:GS})); if(undo.length>30) undo.shift();
  const before=JSON.stringify(GS); fn(); persist(); if(JSON.stringify(GS)!==before) persist2(); render(); if(msg) toast(msg,true); }
let toastT=null;

  clearTimeout(toastT); toastT=setTimeout(()=>el.innerHTML='',5000); }
function saveUI(){ try{localStorage.setItem('metas-open',JSON.stringify([...ui.open])); localStorage.setItem('metas-tab',ui.tab);}catch(e){} }

/* ---------- render ---------- */

  renderSummary(); renderFilters(); renderGoals(); renderHistory(); }

function sparkPath(){
  const pts=[0]; let acc=0; const ev=[...state.log].sort((a,b)=>String(a.d).localeCompare(String(b.d)));
  ev.forEach(e=>{ if(e.type==='in') acc+=e.amt; else if(e.type==='out'||e.type==='buy') acc-=e.amt; else return; pts.push(acc); });
  if(pts.length<3) return '';
  const w=600,h=54,max=Math.max(...pts,1),min=Math.min(0,...pts);
  const xy=pts.map((v,i)=>[i/(pts.length-1)*w, h-4-(v-min)/(max-min||1)*(h-10)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=xy[xy.length-1];
  return `<div style="display:grid;gap:4px"><span class="lbl">Evolução do que você guardou</span>
   <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">

    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#sg)"/>
    <path d="${d}" fill="none" stroke="#d36d9c" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#a98be8"/></svg></div>`;
}
function renderSummary(){
  const buy=ofKind('compra');
  const metas=state.goals.filter(g=>g.kind!=='recorrente'); const saved=totalSaved(); const need=metas.reduce((a,g)=>a+target(g),0);
  const covered=metas.reduce((a,g)=>a+Math.min(g.saved,target(g)||g.saved),0);
  const monthly=state.fixed.reduce((a,f)=>a+f.value,0);

  $('#summary').innerHTML=`<section class="hero">

    <div class="stats">
     <div class="stat"><span class="lbl">Soma das metas</span><b class="money">${brl(need)}</b></div>

    </div>

function renderTabs(){

}

  const chip=(k,l)=>`<button class="chip" data-act="hz" data-v="${k}" aria-pressed="${ui.h===k}">${l}</button>`;
  $('#filters').innerHTML=chip('todos','Todos')+chip('curto','Curto')+chip('medio','Médio')+chip('longo','Longo')+
   (nrev?`<button class="chip" data-act="review" aria-pressed="${ui.review}">A revisar (${nrev})</button>`:'')+
   `<input class="search" id="q" type="search" placeholder="Buscar…" value="${esc(ui.q)}" aria-label="Buscar item">
    <label class="toggle"><input type="checkbox" id="showDone" ${ui.showDone?'checked':''}> mostrar feitos</label>`;
}
function itemVisible(g,i){

  if(!(g.kind==='recorrente') && !ui.showDone && !ui.doneGoals.has(g.id) && i.done) return false;
  if(ui.review && !i.rev) return false;
  if(ui.q){ const q=ui.q.toLowerCase(); if(![i.name,g.name,i.sub].some(x=>(x||'').toLowerCase().includes(q))) return false; }

function itemsHTML(g,vis){

    return `<div class="sub"><h4>${esc(s||'Outros')}</h4><span class="subr">${dn}/${all.length} ${g.kind==='recorrente'?'comprados':'feitos'}${tot?` · <span class="money">${brl(tot)}</span>`:''}${s?`<span class="secmv"><button data-act="sec-edit" data-sub="${esc(s)}" aria-label="Editar a seção ${esc(s)}">✎</button><button data-act="sec-up" data-sub="${esc(s)}" aria-label="Subir a seção ${esc(s)}" ${si<=0?'disabled':''}>▲</button><button data-act="sec-down" data-sub="${esc(s)}" aria-label="Descer a seção ${esc(s)}" ${si>=ns-1?'disabled':''}>▼</button></span>`:''}</span></div>

function renderGoals(kind,elx){
  if(!kind && ui.tab==='gastos'){ render(); return; }
  kind=kind||ui.tab; const el=elx||$('#goals'); const list=ofKind(kind);

  const filtering= ui.h!=='todos'||ui.q||ui.review;

       <div class="gmeta">

        ${tot?`<span>${done}/${tot} ${g.kind==='recorrente'?'comprados':'feitos'}</span>`:'<span>sem itens</span>'}
        ${subs.length?`<span>${subs.length} seções</span>`:''}
       </div>
      </button>
     </div>
     ${open?`<div class="gbody">
      ${g.note?`<div class="gnote">${esc(g.note)}</div>`:''}
      ${vis.length||(subsOf(g).length&&!filtering)?itemsHTML(g,vis):'<p class="muted" style="padding:8px 0;margin:0">Nenhum item aqui com esse filtro.</p>'}
      ${(()=>{ const nd=g.items.filter(i=>i.done).length; if((g.kind==='recorrente')) return nd?`<button class="donetoggle" data-act="rec-reset">↻ Nova compra: desmarcar os ${nd} comprados</button>`:''; return nd&&!ui.showDone?`<button class="donetoggle" data-act="toggle-done">${ui.doneGoals.has(g.id)?'Esconder os feitos':'Ver os '+nd+' feito'+(nd>1?'s':'')}</button>`:''; })()}
      <form class="addrow" data-act="add-item">
       ${subs.length?`<select name="s" aria-label="Seção">${subs.map(s=>`<option ${s===ui.lastSub?'selected':''}>${esc(s)}</option>`).join('')}<option value="">Outros</option></select>`:''}
       <input class="n" name="n" placeholder="Novo item" aria-label="Novo item"><input class="p" name="p" inputmode="decimal" placeholder="R$ preço" aria-label="Preço"><button class="btn sm">Adicionar</button></form>
      <div class="gfoot">${(g.kind==='compra'||money)&&g.kind!=='recorrente'?'<button class="btn sm" data-act="save-money-goal">Guardar aqui</button>':''}<button class="btn sm" data-act="sec-new">+ Seção</button><button class="btn sm" data-act="edit-goal">Editar meta</button></div>
     </div>`:''}
    </article>`;
  });
  el.innerHTML=html||'<div class="goal empty">Nada encontrado com esse filtro.</div>';
}
function notaHTML(t){ return esc(t).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener" class="nlink">${esc(siteDe(u.replace(/&amp;/g,'&')))} ↗</a>`); }
const imgSrc=id=>(window.IMG_URL?window.IMG_URL(id):'/_blob/'+id);
function siteDe(u){ try{ return new URL(u).hostname.replace(/^www\./,'').replace(/^m\./,''); }catch(e){ return 'abrir link'; } }
function openSec(g,nome){
  const isNew=nome==null, n=isNew?0:g.items.filter(i=>i.sub===nome).length; let armado=null;
  const draw=()=>modal(`<h2>${isNew?'Nova seção':'Editar seção'}</h2><p class="muted" style="margin:0">${esc(g.name)}</p>
   <form id="scf" style="display:grid;gap:12px"><div class="field"><label for="sc-n">Nome da seção</label><input id="sc-n" value="${esc(nome||'')}" placeholder="Ex.: Nordeste, Cozinha" required></div>
   ${isNew?'':`<div class="field"><label>Apagar a seção</label><div style="display:flex;gap:8px;flex-wrap:wrap">
     <button type="button" class="btn sm ${armado==='keep'?'primary':''}" data-del="keep">${armado==='keep'?'Toque de novo para confirmar':'Apagar e manter os '+n+' itens em "Outros"'}</button>
     ${n?`<button type="button" class="btn sm danger" data-del="all" style="${armado==='all'?'background:var(--bad);color:#fff':''}">${armado==='all'?'Toque de novo para apagar tudo':'Apagar com os '+n+' itens'}</button>`:''}</div></div>`}
   <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
  const bind=()=>{
    $('#scf').onsubmit=e=>{ e.preventDefault(); const v=$('#sc-n').value.trim(); if(!v) return;
      if(v!==nome && subsOf(g).includes(v)){ toast('Já existe uma seção com esse nome.'); return; }
      mutate(()=>{ const secs=subsOf(g);
        if(isNew){ secs.push(v); ui.lastSub=v; ui.open.add(g.id); }
        else { secs[secs.indexOf(nome)]=v; g.items.forEach(i=>{ if(i.sub===nome) i.sub=v; }); if(ui.lastSub===nome) ui.lastSub=v; }
        g.secs=secs; }, isNew?'Seção criada':'Seção renomeada'); saveUI(); close(); };
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const k=b.dataset.del;
      if(armado!==k){ armado=k; const v=$('#sc-n').value; draw(); $('#sc-n').value=v; bind(); return; }
      mutate(()=>{ g.secs=subsOf(g).filter(x=>x!==nome); if(k==='all') g.items=g.items.filter(i=>i.sub!==nome); else g.items.forEach(i=>{ if(i.sub===nome) delete i.sub; }); }, k==='all'?'Seção e itens apagados':'Seção apagada, itens em "Outros"'); close(); });
  };
  draw(); bind();
}
function pickImg(g,i){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return; toast('Enviando foto…');
    try{
      const blob=await reduzir(f);
      const r=await assets.upload(blob,{type:'image/jpeg'});
      mutate(()=>{ const it=findG(g.id).items.find(x=>x.id===i.id); it.imgs=[...(it.imgs||[]), r.id]; },'Foto salva');
    }catch(e){ toast(e&&e.code==='not_granted'?'Sem permissão para guardar fotos aqui.':'Não consegui enviar a foto. Tente outra imagem (JPG ou PNG).'); }
  };
  inp.click();
}
function reduzir(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const m=1400, k=Math.min(1,m/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.85); };
  im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; im.src=url; }); }
function viewImg(g,i,k){
  let armado=false;
  const draw=()=>{ modal(`<div class="lightbox" style="display:grid;gap:10px"><h2>${esc(i.name)}</h2><img src="${esc(imgSrc(i.imgs[k]))}" alt="Foto de ${esc(i.name)}">
    ${i.imgs.length>1?`<div style="display:flex;gap:6px;justify-content:center">${i.imgs.map((_,j)=>`<button class="btn sm ${j===k?'primary':''}" data-k="${j}">${j+1}</button>`).join('')}</div>`:''}
    <div class="actions">${assets?`<button type="button" class="btn danger" id="im-del">${armado?'Toque de novo para apagar':'Apagar foto'}</button>`:''}<span style="flex:1"></span>${i.link?`<a class="btn primary" href="${esc(i.link)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir na loja ↗</a>`:''}<button type="button" class="btn" data-act="close">Fechar</button></div></div>`);
    document.querySelectorAll('.lightbox [data-k]').forEach(b=>b.onclick=()=>{ k=+b.dataset.k; armado=false; draw(); });
    const d=$('#im-del'); if(d) d.onclick=async()=>{ if(!armado){ armado=true; draw(); return; } const id=i.imgs[k];
      mutate(()=>{ const it=findG(g.id).items.find(x=>x.id===i.id); it.imgs=(it.imgs||[]).filter(x=>x!==id); if(!it.imgs.length) delete it.imgs; },'Foto apagada'); close();
      try{ await assets.delete(id); }catch(e){} };
  };
  draw();
}
function secOpts(g,cur){ const ss=subsOf(g); return `<option value="" ${!cur?'selected':''}>${ss.length?'Outros (sem seção)':'Sem seção'}</option>`+ss.map(x=>`<option value="${esc(x)}" ${x===cur?'selected':''}>${esc(x)}</option>`).join('')+`<option value="__new">+ Nova seção…</option>`; }

function openToSub(g,i){
  const grupo=x=>`<optgroup label="${esc(x.name)}">${x.items.filter(y=>y.id!==i.id&&!y.done).map(y=>`<option value="${x.id}|${y.id}">${esc(y.name)}${y.sub?' · '+esc(y.sub):''}</option>`).join('')}</optgroup>`;

function blankG(){return {version:1,cats:['Alimentação','Transporte','Saúde','Pets','Casa','Limpeza','Beleza','Roupa','Lazer','Assinaturas','Parcelas','Outros'].map(n=>({name:n,limite:0})),pags:['Pix/Dinheiro','Cartão Nubank','Cartão Inter','Vales'],months:{}}}
function normG(g){ g=g&&typeof g==='object'?JSON.parse(JSON.stringify(g)):blankG();
  g.cats=Array.isArray(g.cats)?g.cats:blankG().cats; g.pags=Array.isArray(g.pags)?g.pags:[]; g.months=g.months&&typeof g.months==='object'?g.months:{};
  Object.values(g.months).forEach(m=>{ m.entradas=Array.isArray(m.entradas)?m.entradas:[]; m.saidas=Array.isArray(m.saidas)?m.saidas:[];
    [...m.entradas,...m.saidas].forEach(x=>{x.id=x.id||uid(); x.valor=+x.valor||0;}); });

const curKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mLabel=k=>{const [y,m]=k.split('-');return MES[+m-1]+' '+y};
const shiftKey=(k,n)=>{let [y,m]=k.split('-').map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+'-'+String(m).padStart(2,'0')};
function month(k,create){ if(!GS.months[k]&&create) GS.months[k]={entradas:[],saidas:[]}; return GS.months[k]||{entradas:[],saidas:[]}; }
const sumE=m=>m.entradas.reduce((a,x)=>a+x.valor,0), sumS=m=>m.saidas.reduce((a,x)=>a+x.valor,0);

function monthChart(){
  const keys=Object.keys(GS.months).sort().slice(-12); if(!keys.length) return '';
  const data=keys.map(k=>({k,e:sumE(GS.months[k]),s:sumS(GS.months[k])}));
  const max=Math.max(...data.map(d=>Math.max(d.e,d.s)),1);
  const W=620,H=170,L=46,B=26,T=10,cw=(W-L-8)/data.length,bw=Math.min(16,cw/2-3);
  const y=v=>T+(H-T-B)*(1-v/max);
  const step=max>4000?1000:max>2000?500:250; let grid='';
  for(let v=0;v<=max;v+=step) grid+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="#f1dde8"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#9c7d98">${v>=1000?(v/1000)+'k':v}</text>`;
  const bars=data.map((d,i)=>{const x=L+i*cw+cw/2; const sel=d.k===ui.month;
    return `<g><rect x="${x-bw-1}" y="${y(d.e)}" width="${bw}" height="${H-B-y(d.e)}" rx="3" fill="#7cc9a0" opacity="${sel?1:.55}"/>
     <rect x="${x+1}" y="${y(d.s)}" width="${bw}" height="${H-B-y(d.s)}" rx="3" fill="#ee8fb5" opacity="${sel?1:.55}"/>
     <text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="${sel?'#4a3550':'#9c7d98'}" font-weight="${sel?700:400}">${MES[+d.k.split('-')[1]-1].slice(0,3)}</text>
     <title>${mLabel(d.k)} · entradas ${brl(d.e)} · saídas ${brl(d.s)}</title></g>`}).join('');
  return `<section class="section"><div class="sechead"><h2>Entradas e saídas por mês</h2>
    <span class="muted" style="font-size:.8rem;display:flex;gap:12px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#7cc9a0"></i> entradas</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#ee8fb5"></i> saídas</span></span></div>
    <div class="tscroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="Entradas e saídas por mês">${grid}${bars}</svg></div></section>`;
}
function fixosPrevistos(k){
  const ant=Object.keys(GS.months).filter(x=>x<k&&(GS.months[x].saidas.length||GS.months[x].fx)).sort().pop(); if(!ant) return [];
  let n=0; for(let x=ant;x<k;x=shiftKey(x,1)) n++;
  const out=[]; GS.months[ant].saidas.filter(x=>x.fixo).forEach(x=>{
    const pm=x.desc.match(/(\d+)\/(\d+)/); if(pm&&+pm[1]+n>+pm[2]) return;
    const y=JSON.parse(JSON.stringify(x)); y.id=uid(); y.pago=false; delete y.d;
    if(pm) y.desc=y.desc.replace(pm[0],(+pm[1]+n)+'/'+pm[2]); out.push(y); });
  return out;
}
function levarFixos(k){
  // só lança quando o mês chega de verdade; olhar meses futuros não grava nada
  if(!GS||k!==curKey()||(GS.months[k]&&GS.months[k].fx)) return;
  const lista=fixosPrevistos(k); const m=month(k,true); m.fx=true;
  lista.filter(x=>!m.saidas.some(y=>y.fixo&&y.desc===x.desc&&y.valor===x.valor)).forEach(x=>m.saidas.push(x));
  persist2();
}

/* ---------- plano de economia ---------- */
const HZM={curto:12,medio:36,longo:84};
const addMonths=n=>{const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+n); return MES[d.getMonth()].slice(0,3).toLowerCase()+'/'+d.getFullYear()};
function planHTML(saldo){
  const mensal=state.plan&&state.plan.mensal!=null?state.plan.mensal:500;
  const goals=ofKind('compra').map(g=>({g,rem:r2(Math.max(0,target(g)-g.saved))})).filter(x=>x.rem>0);
  const total=goals.reduce((a,x)=>a+x.rem,0);
  const byH={curto:0,medio:0,longo:0}; goals.forEach(x=>byH[x.g.h]+=x.rem/HZM[x.g.h]);
  const prazo=Math.ceil(byH.curto+byH.medio+byH.longo);

  const rows=goals.map(x=>{ cum+=x.rem; const n=mensal>0?Math.ceil(cum/mensal):Infinity;
    return `<li><div class="iname"><span>${esc(x.g.name)}</span> <span class="pill h-${x.g.h}">${HZS[x.g.h]}</span><small>falta ${brl(x.rem)}</small></div>
      <span class="num" style="text-align:right">${n===Infinity?'—':n<=0?'já dá':`${addMonths(n)}<small class="muted" style="display:block;font-size:.75rem">${n} ${n===1?'mês':'meses'}</small>`}</span></li>`; }).join('');
  const all=mensal>0?Math.ceil(total/mensal):Infinity;

   <div class="row2" style="align-items:end">

    ${saldo>0?`<button class="btn sm" data-act="plan-use" data-v="${saldo}" style="justify-self:start">Usar a sobra deste mês (${brl(saldo)})</button>`:'<span></span>'}

   </div>
   <div class="gnote" style="margin-top:0">Para cumprir os prazos (curto em 1 ano, médio em 3 e longo em 7), você precisaria guardar <b class="money">${brl(prazo)}/mês</b>: ${brl(Math.ceil(byH.curto))} para o curto, ${brl(Math.ceil(byH.medio))} para o médio e ${brl(Math.ceil(byH.longo))} para o longo prazo.</div>

   <span class="muted" style="font-size:.8rem">Metas sem preço não entram na conta. Coloque os preços para a previsão ficar certa.</span>
  </section>`;
}

/* ---------- investimentos ---------- */

const invCfg=()=>Object.assign({},INV_DEF,state.invest||{});
function fv(P,C,ratePct,months){ const r=Math.pow(1+ratePct/100,1/12)-1; const f=Math.pow(1+r,months); return r===0?P+C*months:P*f+C*(f-1)/r; }
function needMonthly(T,P,ratePct,months){ if(months<=0) return Infinity; const r=Math.pow(1+ratePct/100,1/12)-1; const f=Math.pow(1+r,months); const v=r===0?(T-P)/months:(T-P*f)*r/(f-1); return Math.max(0,v); }
const stepsOf=c=>(Array.isArray(c.steps)?c.steps:[]).filter(x=>x&&isFinite(+x.idade)).map(x=>({idade:+x.idade,mensal:+x.mensal||0})).sort((a,b)=>a.idade-b.idade);
function aporteAt(c,m){ const age=c.idade+(m-1)/12; let v=c.mensal; stepsOf(c).forEach(st=>{ if(age>=st.idade) v=st.mensal; }); return v; }
function simPath(c,months){ const r=Math.pow(1+c.taxa/100,1/12)-1; const tot=[c.inicial], bolso=[c.inicial]; let bal=c.inicial, b=c.inicial;
  for(let m=1;m<=months;m++){ const a=aporteAt(c,m); bal=bal*(1+r)+a; b+=a; tot.push(bal); bolso.push(b); } return {tot,bolso,r}; }
const irPct=d=>d<=180?.225:d<=360?.2:d<=720?.175:.15;
// saldo líquido de IR: cada aporte é um lote com o próprio prazo; fee = taxa de custódia anual; isentoAte = parte sem custódia
function simLiq(c,months,nomPct,fee,taxed,isentoAte){ const r=Math.pow(1+nomPct/100,1/12)-1; const lots=[]; if(c.inicial>0) lots.push({v:c.inicial,c:c.inicial,m:0});
  for(let m=1;m<=months;m++){ const a=aporteAt(c,m); if(a>0) lots.push({v:a,c:a,m:m-1}); let tot=0; lots.forEach(l=>{l.v*=1+r; tot+=l.v;});
    if(fee&&tot>isentoAte){ const k=(tot-isentoAte)*fee/12/tot; lots.forEach(l=>{l.v-=l.v*k;}); } }
  let bruto=0,ir=0,custo=0; lots.forEach(l=>{ bruto+=l.v; custo+=l.c; if(taxed) ir+=Math.max(0,l.v-l.c)*irPct((months-l.m)*30); });
  return {bruto,ir,liq:bruto-ir,custo}; }
const realRate=c=>c.real?c.taxa:((1+c.taxa/100)/(1+c.inflacao/100)-1)*100;
const CTRL=[['inicial','Já tenho investido',0,200000,500,'R$'],['mensal','Vou investir por mês',0,5000,50,'R$'],['idade','Minha idade hoje',14,70,1,'anos'],['ate','Até a idade de',18,80,1,'anos'],['taxa','Rendimento ao ano (CDI/Selic)',1,20,0.5,'%'],['inflacao','Inflação ao ano',0,12,0.5,'%'],['ipca','Tesouro IPCA+ paga acima da inflação',0,12,0.1,'%']];

const findG=id=>state.goals.find(g=>g.id===id);
function distribute(){
  let pool=state.pool, moved=0;
  for(const g of state.goals){ if(pool<=0) break; if(g.kind==='recorrente') continue; const t=target(g); if(t<=0) continue; const need=r2(t-g.saved); if(need<=0) continue;
    const give=Math.min(pool,need); g.saved=r2(g.saved+give); pool=r2(pool-give); moved+=give;
    state.log.push({id:uid(),d:today(),type:'dist',amt:give,goal:g.id}); }
  state.pool=pool; return moved;
}

    <div class="field"><label for="f-p">Parcela (ex.: 7/12)</label><input id="f-p" name="p" value="${esc(f.parc||'')}"></div></div>
   <div class="field"><label for="f-o">Observação</label><input id="f-o" name="o" value="${esc(f.note||'')}"></div>
   <div class="actions">${isNew?'':'<button type="button" class="btn danger" id="f-del">Excluir</button>'}<span style="flex:1"></span><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
  $('#ff').onsubmit=e=>{e.preventDefault(); const d=new FormData(e.target);
    mutate(()=>{ let x=isNew?{id:uid()}:state.fixed.find(y=>y.id===f.id); Object.assign(x,{name:d.get('n').trim(),value:parseBRL(d.get('v')),parc:d.get('p')||'',note:d.get('o')||''}); if(isNew) state.fixed.push(x); },'Gasto salvo'); close(); };
  const del=$('#f-del'); if(del) del.onclick=()=>{ mutate(()=>{state.fixed=state.fixed.filter(y=>y.id!==f.id)},'Gasto excluído'); close(); };
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const act=t.dataset.act;
  const gEl=t.closest('[data-goal]'); const g=gEl&&findG(gEl.dataset.goal);
  const iEl=t.closest('[data-item]'); const it=g&&iEl&&g.items.find(x=>x.id===iEl.dataset.item);
  if(act==='close-bg'){ if(e.target===t) close(); return; }
  if(!state && act!=='close') return;
  switch(act){
   case 'close': close(); break;
   case 'undo': if(undo.length){ const u=JSON.parse(undo.pop()); state=norm(u.s); if(u.g){ GS=normG(u.g); persist2(); } persist(); render(); $('#toast').innerHTML=''; } break;
   case 'tab': ui.tab=t.dataset.v; ui.review=false; saveUI(); render(); break;
   case 'hz': ui.h=t.dataset.v; render(); break;
   case 'review': ui.review=!ui.review; render(); break;
   case 'toggle': ui.open.has(g.id)?ui.open.delete(g.id):ui.open.add(g.id); saveUI(); renderGoals(); break;
   case 'up': case 'down': { const L=ofKind(g.kind), k=L.indexOf(g), other=L[act==='up'?k-1:k+1]; if(!other) break;
     mutate(()=>{ const a=state.goals.indexOf(g), b=state.goals.indexOf(other); [state.goals[a],state.goals[b]]=[state.goals[b],state.goals[a]]; }); break; }
   case 'check': e.preventDefault(); {
     const willDone=!it.done;
     if(willDone && it.price>0 && g.saved>0){ const amt=Math.min(it.price,g.saved);
       mutate(()=>{ it.done=true; it.doneAt=today(); g.saved=r2(g.saved-amt); state.log.push({id:uid(),d:today(),type:'buy',amt,goal:g.id,note:it.name}); }, `Feito! Descontei ${brl(amt)} de “${g.name}”`);
     } else mutate(()=>{ it.done=willDone; if(willDone) it.doneAt=today(); }, willDone?((g.kind==='recorrente')?'Comprado':'Marcado como feito'):'Desmarcado'); } break;
   case 'rec-reset': mutate(()=>{ g.items.forEach(i=>{ if(i.done){ i.lastAt=i.doneAt||i.lastAt; i.done=false; delete i.doneAt; } }); },'Lista pronta para a próxima compra'); break;
   case 'edit-item': openItem(g,it); break;
   case 'add-link': openLink(g,it); break;
   case 'sub-hide': ui.subHide.has(it.id)?ui.subHide.delete(it.id):ui.subHide.add(it.id); try{localStorage.setItem('metas-subhide',JSON.stringify([...ui.subHide]))}catch(_){} renderGoals(); break;
   case 'sub-open': ui.subHide.delete(it.id); ui.subOpen.add(it.id); renderGoals(); setTimeout(()=>{ const n=document.querySelector(`[data-item="${it.id}"] [data-subadd]`); if(n) n.focus(); },0); break;
   case 'sub-up': { const k=+t.dataset.k, x=it.subs[k];
     mutate(()=>{ it.subs.splice(k,1); if(!it.subs.length){ delete it.subs; ui.subOpen.delete(it.id); } const novo={id:uid(),name:x.t,price:0}; if(it.sub) novo.sub=it.sub; if(x.feito) novo.done=true; g.items.splice(g.items.indexOf(it)+1,0,novo); },`“${x.t}” virou tarefa`); } break;
   case 'sub-del': mutate(()=>{ it.subs.splice(+t.dataset.k,1); if(!it.subs.length){ delete it.subs; ui.subOpen.delete(it.id); } }); break;
   case 'sub-check': e.preventDefault(); { const k=+t.dataset.k; let auto=false;
     mutate(()=>{ it.subs[k].feito=!it.subs[k].feito; if(it.subs.every(x=>x.feito)&&!it.done){ it.done=true; auto=true; } },
       null); toast(auto?`Todas feitas! “${it.name}” marcado como feito.`:'Subtarefa atualizada',true); } break;
   case 'move-item': openMove(g,it); break;
   case 'del-item': mutate(()=>{ g.items=g.items.filter(x=>x!==it); },`“${it.name}” excluído`); break;
   case 'item-more': openMore(g,it); break;
   case 'toggle-done': ui.doneGoals.has(g.id)?ui.doneGoals.delete(g.id):ui.doneGoals.add(g.id); renderGoals(); break;
   case 'add-img': pickImg(g,it); break;
   case 'img-view': viewImg(g,it,+t.dataset.k); break;
   case 'sec-up': case 'sec-down': { const subs=subsOf(g), k=subs.indexOf(t.dataset.sub), j=act==='sec-up'?k-1:k+1; if(k<0||j<0||j>=subs.length) break;
     mutate(()=>{ [subs[k],subs[j]]=[subs[j],subs[k]]; g.secs=subs.slice(); const order=[...subs,'']; g.items=order.flatMap(sb=>g.items.filter(i=>(i.sub||'')===sb)); }); } break;
   case 'sec-new': openSec(g,null); break;
   case 'sec-edit': openSec(g,t.dataset.sub); break;
   case 'edit-goal': openGoal(g); break;
   case 'new-goal': openGoal(null); break;
   case 'new-rec': openGoal(null,'recorrente'); break;
   case 'save-money': ui.tab==='gastos'?openTx(null):openMoney(null); break;
   case 'plan-use': mutate(()=>{ state.plan=Object.assign({},state.plan,{mensal:+t.dataset.v}); }); break;
   case 'step-add': mutate(()=>{ const c=invCfg(), st=stepsOf(c); const last=st.length?st[st.length-1]:{idade:c.idade,mensal:c.mensal}; st.push({idade:Math.min(c.ate-1,last.idade+5),mensal:Math.round((last.mensal||100)*2)}); state.invest=Object.assign({},c,{steps:st}); }); break;
   case 'step-del': mutate(()=>{ const c=invCfg(), st=stepsOf(c); st.splice(+t.dataset.i,1); state.invest=Object.assign({},c,{steps:st}); }); break;
   case 'inv-real': mutate(()=>{ state.invest=Object.assign({},invCfg(),{real:t.dataset.v==='1'}); }); break;
   case 'inv-from-goal': { const ig=ofKind('compra').find(g=>/invest/i.test(g.name)); mutate(()=>{ state.invest=Object.assign({},invCfg(),{inicial:ig.saved}); }); } break;
   case 'save-money-goal': openMoney(g.id); break;
   case 'distribute': { let moved=0; mutate(()=>{moved=distribute()}); toast(`${brl(moved)} distribuídos pela prioridade`,true); } break;
   case 'add-fixed': openFixed(null); break;
   case 'edit-fixed': openFixed(state.fixed.find(f=>f.id===t.closest('[data-fixed]').dataset.fixed)); break;
   case 'm-prev': ui.month=shiftKey(ui.month,-1); render(); break;
   case 'm-next': ui.month=shiftKey(ui.month,1); render(); break;
   case 'tx-new': openTx(null); break;
   case 'in-new': openIn(null); break;
   case 'tx-edit': openTx(month(ui.month).saidas.find(x=>x.id===t.closest('[data-tx]').dataset.tx)); break;
   case 'in-edit': openIn(month(ui.month).entradas.find(x=>x.id===t.closest('[data-in]').dataset.in)); break;
   case 'tx-paid': e.preventDefault(); { const x=month(ui.month).saidas.find(y=>y.id===t.closest('[data-tx]').dataset.tx); mutate(()=>{x.pago=x.pago===false}); } break;
   case 'cat-edit': openCat(t.dataset.cat); break;
   case 'save-rest': { const m=month(ui.month); openMoney(null, r2(sumE(m)-sumS(m)), 'Sobra de '+mLabel(ui.month)); } break;
   case 'copy-fixed': { const p=month(shiftKey(ui.month,-1)); mutate(()=>{ const m=month(ui.month,true);
       p.saidas.filter(x=>x.fixo).forEach(x=>{ const y=JSON.parse(JSON.stringify(x)); y.id=uid(); y.pago=false; delete y.d; y.desc=y.desc.replace(/(\d+)\/(\d+)/,(s,a,b)=>+a<+b?(+a+1)+'/'+b:s); m.saidas.push(y); }); },'Fixos copiados como não pagos'); } break;
   case 'launch-fixed': mutate(()=>{ const m=month(ui.month,true); state.fixed.filter(f=>f.value>0).forEach(f=>m.saidas.push({id:uid(),desc:f.name+(f.parc?' '+f.parc:''),valor:f.value,cat:'Outros',fixo:true,pago:false})); },'Fixos previstos lançados no mês'); break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target; if(f.dataset.act!=='add-item') return; e.preventDefault();
  const g=findG(f.closest('[data-goal]').dataset.goal); const n=f.n.value.trim(); if(!n){f.n.focus();return;}
  const price=parseBRL(f.p.value), sub=f.s?f.s.value:''; if(sub) ui.lastSub=sub;
  mutate(()=>{ const x={id:uid(),name:n,price}; if(sub) x.sub=sub;
    if(sub){ let last=-1; g.items.forEach((y,k)=>{ if(y.sub===sub) last=k; }); g.items.splice(last+1,0,x); } else g.items.push(x); },'Item adicionado');
  const nf=document.querySelector(`[data-goal="${g.id}"] .addrow input.n`); if(nf) nf.focus();
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ ui.q=e.target.value; renderGoals(); } });
document.addEventListener('change',e=>{
  if(e.target.matches&&e.target.matches('[data-subedit]')){ const g=findG(e.target.closest('[data-goal]').dataset.goal), it=g.items.find(x=>x.id===e.target.closest('[data-item]').dataset.item), k=+e.target.dataset.k, v=e.target.value.trim();
    if(!v){ e.target.value=it.subs[k].t; return; } if(v!==it.subs[k].t) mutate(()=>{ it.subs[k].t=v; }); return; } if(e.target.id==='showDone'){ ui.showDone=e.target.checked; renderGoals(); }
  if(e.target.id==='pl-m'){ const v=parseBRL(e.target.value); mutate(()=>{ state.plan=Object.assign({},state.plan,{mensal:v}); }); setTimeout(()=>{const s=$('#plano'); if(s) s.scrollIntoView({block:'nearest'})},0); }
  if(e.target.dataset && (e.target.dataset.inv||e.target.dataset.step!=null)){ persist(); }
});
document.addEventListener('input',e=>{ const ds=e.target.dataset||{};
  if(ds.step!=null){ const c=invCfg(); const st=(Array.isArray(c.steps)?c.steps:[]).map(x=>({...x})); const v=parseBRL(e.target.value); if(st[+ds.step]){ st[+ds.step][ds.f]=v; state.invest=Object.assign({},c,{steps:st}); updateInvest(); } return; }
  const k=ds.inv; if(!k) return;
  let v=e.target.type==='range'?+e.target.value:parseBRL(e.target.value); if(!isFinite(v)) return;
  state.invest=Object.assign({},invCfg(),{[k]:v});
  const other=e.target.type==='range'?$('#ivn-'+k):$('#iv-'+k); if(other) other.value=e.target.type==='range'?String(v).replace('.',','):v;
  updateInvest();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close();
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-subedit]')){ e.preventDefault(); e.target.blur(); return; }
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-subadd]')){ e.preventDefault(); const v=e.target.value.trim(); if(!v) return;
    const g=findG(e.target.closest('[data-goal]').dataset.goal), id=e.target.closest('[data-item]').dataset.item, it=g.items.find(x=>x.id===id);
    mutate(()=>{ it.subs=[...(it.subs||[]),{t:v,feito:false}]; });
    setTimeout(()=>{ const n=document.querySelector(`[data-item="${id}"] [data-subadd]`); if(n) n.focus(); },0); } });

/* ---------- arrastar para reordenar ---------- */
let drag=null;
const filtrando=()=> ui.h!=='todos'||ui.q||ui.review;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-grip]'); if(!h||e.button>0) return;
  if(filtrando()){ toast('Tire os filtros para mudar a ordem.'); return; }
  const card=h.closest('.goal'); e.preventDefault();
  try{ h.setPointerCapture(e.pointerId); }catch(_){}
  drag={card,base:e.clientY,y:e.clientY,start:[...document.querySelectorAll('#goals .goal[data-goal]')].map(x=>x.dataset.goal).join(),pid:e.pointerId};
  card.classList.add('dragging'); $('#goals').classList.add('sorting');
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return; e.preventDefault();
  drag.y=e.clientY; const c=drag.card;
  let dy=e.clientY-drag.base; c.style.transform=`translateY(${dy}px)`;
  const next=c.nextElementSibling, prev=c.previousElementSibling;
  if(dy>0&&next&&next.dataset.goal){ const r=next.getBoundingClientRect(); if(e.clientY>r.top+r.height/2){ next.after(c); drag.base+=r.height+12; } }
  else if(dy<0&&prev&&prev.dataset.goal){ const r=prev.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){ prev.before(c); drag.base-=r.height+12; } }
  c.style.transform=`translateY(${e.clientY-drag.base}px)`;
  if(e.clientY<70) window.scrollBy(0,-14); else if(e.clientY>window.innerHeight-70) window.scrollBy(0,14);
},{passive:false});
function soltar(){
  if(!drag) return; const c=drag.card; c.style.transform=''; c.classList.remove('dragging'); $('#goals').classList.remove('sorting');
  const ids=[...document.querySelectorAll('#goals .goal[data-goal]')].map(x=>x.dataset.goal); const mudou=ids.join()!==drag.start; drag=null;
  if(!mudou) return;
  mutate(()=>{ const kind=findG(ids[0]).kind, fila=ids.map(findG); state.goals=state.goals.map(g=>g.kind===kind?fila.shift():g); },'Ordem atualizada');
}
document.addEventListener('pointerup',soltar); document.addEventListener('pointercancel',soltar);
document.addEventListener('keydown',e=>{
  const h=e.target.closest&&e.target.closest('[data-grip]'); if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown')) return; e.preventDefault();
  const g=findG(h.closest('.goal').dataset.goal), L=ofKind(g.kind), k=L.indexOf(g), other=L[e.key==='ArrowUp'?k-1:k+1]; if(!other) return;
  mutate(()=>{ const a=state.goals.indexOf(g), b=state.goals.indexOf(other); [state.goals[a],state.goals[b]]=[state.goals[b],state.goals[a]]; });
  setTimeout(()=>{ const n=document.querySelector(`[data-goal="${g.id}"] [data-grip]`); if(n) n.focus(); },0);
});
/* ---------- arrastar itens (reordenar ou soltar em cima para virar subtarefa) ---------- */
let idrag=null;
function limparAlvo(){ document.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach(x=>x.classList.remove('drop-before','drop-after','drop-into')); }
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-igrip]'); if(!h||e.button>0) return;
  if(ui.h!=='todos'||ui.q||ui.review){ toast('Tire os filtros para mudar a ordem.'); return; }
  const li=h.closest('li.item'), body=li.closest('.gbody'); e.preventDefault();
  try{ h.setPointerCapture(e.pointerId); }catch(_){}
  idrag={li,body,y0:e.clientY,s0:window.scrollY,pid:e.pointerId,alvo:null,modo:null};
  li.classList.add('dragging');
});
document.addEventListener('pointermove',e=>{
  if(!idrag||e.pointerId!==idrag.pid) return; e.preventDefault();
  const {li,body}=idrag;
  li.style.transform=`translateY(${e.clientY-idrag.y0+(window.scrollY-idrag.s0)}px)`;
  li.style.pointerEvents='none';
  const el=document.elementFromPoint(e.clientX,e.clientY); li.style.pointerEvents='';
  const t=el&&el.closest('li.item'); limparAlvo(); idrag.alvo=null; idrag.modo=null;
  if(t&&t!==li&&body.contains(t)){
    const r=t.getBoundingClientRect(), rel=(e.clientY-r.top)/r.height;
    idrag.alvo=t; idrag.modo=rel<0.28?'before':rel>0.72?'after':'into';
    t.classList.add('drop-'+idrag.modo);
  }
  if(e.clientY<70) window.scrollBy(0,-12); else if(e.clientY>window.innerHeight-70) window.scrollBy(0,12);
},{passive:false});
function soltarItem(){
  if(!idrag) return; const {li,body,alvo,modo}=idrag; idrag=null; li.style.transform=''; li.classList.remove('dragging'); limparAlvo();
  if(!alvo||!modo) return;
  const g=findG(body.closest('.goal').dataset.goal), it=g.items.find(x=>x.id===li.dataset.item), tg=g.items.find(x=>x.id===alvo.dataset.item);
  if(!it||!tg||it===tg) return;
  if(modo==='into'){
    const perde=[it.price?'preço':'',it.link?'link':'',(it.imgs||[]).length?'fotos':''].filter(Boolean);
    mutate(()=>{ tg.subs=[...(tg.subs||[]),{t:it.name,feito:!!it.done},...(it.subs||[]).map(x=>({t:x.t,feito:!!x.feito}))]; g.items=g.items.filter(x=>x!==it); if(tg.done&&tg.subs.some(x=>!x.feito)) tg.done=false; },
      `“${it.name}” virou subtarefa de “${tg.name}”${perde.length?' ('+perde.join(', ')+' não foram junto)':''}`);
    return;
  }
  mutate(()=>{ g.items=g.items.filter(x=>x!==it); if(tg.sub) it.sub=tg.sub; else delete it.sub; const k=g.items.indexOf(tg); g.items.splice(modo==='before'?k:k+1,0,it); },'Ordem atualizada');
}
document.addEventListener('pointerup',soltarItem); document.addEventListener('pointercancel',soltarItem);
document.addEventListener('keydown',e=>{
  const h=e.target.closest&&e.target.closest('[data-igrip]'); if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown')) return; e.preventDefault();
  const li=h.closest('li.item'), g=findG(li.closest('.goal').dataset.goal), it=g.items.find(i=>i.id===li.dataset.item);
  const mesma=g.items.filter(i=>(i.sub||'')===(it.sub||'')), k=mesma.indexOf(it), other=mesma[e.key==='ArrowUp'?k-1:k+1]; if(!other) return;
  mutate(()=>{ const a=g.items.indexOf(it), b=g.items.indexOf(other); [g.items[a],g.items[b]]=[g.items[b],g.items[a]]; });
  setTimeout(()=>{ const n=document.querySelector(`[data-item="${it.id}"] [data-igrip]`); if(n) n.focus(); },0);
});
function loadLocalG(){ try{const c=localStorage.getItem('metas-gastos-cache'); return c?normG(JSON.parse(c)):null}catch(e){return null} }
function loadLocal(){ try{const c=localStorage.getItem('metas-cache'); return c?norm(JSON.parse(c)):null}catch(e){return null} }
async function start(){
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
  if(!db){ GS=loadLocalG()||blankG(); state=loadLocal()||blank(); showBanner('Seus dados estão salvos só neste aparelho. Abra pelo Claude, logado, para sincronizar entre celular e computador.'); render(); return; }
  window.claude.use('assets').then(a=>{ assets=a; if(state) render(); }).catch(()=>{});
  ref=db.doc('app/state'); ref2=db.doc('app/gastos');
  ref2.onSnapshot(snap=>{
    if(saveTimer2) return;
    if(!snap.exists){ if(!GS){ GS=loadLocalG()||blankG(); render(); } return; }
    const data=snap.data(); const j=JSON.stringify(data);
    if(j===lastJSON2 && GS) return;
    GS=normG(data); render();
  },()=>{ if(!GS){ GS=loadLocalG()||blankG(); render(); } });
  ref.onSnapshot(snap=>{
    if(saveTimer) return;
    if(!snap.exists){ if(!state){ state=loadLocal()||blank(); render(); } return; }
    const data=snap.data(); const j=JSON.stringify(data);
    if(j===lastJSON && state) return;
    state=norm(data); render();
  },err=>{ if(!state){ state=loadLocal()||blank(); render(); } showBanner('Não consegui ler os dados salvos ('+(err&&err.code||'erro')+'). Mostrando a última cópia deste aparelho.'); });
}
start();
})();
